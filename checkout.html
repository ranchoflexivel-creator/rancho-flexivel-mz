<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finalizar pedido — Rancho Flexível</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet"></head><body class="bg-[#f4fafd] text-[#161d1f] font-[Inter]"><header class="h-20 bg-white border-b flex items-center"><div class="max-w-5xl mx-auto px-4 w-full flex justify-between items-center"><a href="index.html" class="font-[Montserrat] text-xl font-bold text-[#00361a]">Rancho Flexível</a><a href="index.html" class="text-sm text-[#414942]">← Voltar às compras</a></div></header><main class="max-w-5xl mx-auto px-4 py-10"><div class="grid lg:grid-cols-2 gap-6"><section class="bg-white rounded-2xl p-6 shadow-sm"><h1 class="font-[Montserrat] text-2xl font-bold">Finalizar pedido</h1><div class="mt-6 space-y-4"><label class="block text-sm font-semibold">Nome completo<input id="name" class="mt-1 w-full border rounded-xl p-3"></label><label class="block text-sm font-semibold">Telefone<input id="phone" class="mt-1 w-full border rounded-xl p-3"></label><label class="block text-sm font-semibold">Zona de entrega<select id="zone" class="mt-1 w-full border rounded-xl p-3"><option value="Maputo">Maputo — 400 MZN</option><option value="Zonas circunvizinhas">Zonas circunvizinhas — 700 MZN</option><option value="Matola">Matola — 1.000 MZN</option><option value="Levantamento na mercearia">Levantamento — 0 MZN</option></select></label><label class="block text-sm font-semibold">Morada / ponto de referência<textarea id="address" class="mt-1 w-full border rounded-xl p-3 h-28"></textarea></label><button id="send" class="w-full py-3 bg-[#00361a] text-white rounded-xl font-bold">Criar pedido e enviar pelo WhatsApp</button><p id="msg" class="text-sm"></p></div></section><section class="bg-white rounded-2xl p-6 shadow-sm"><h2 class=
